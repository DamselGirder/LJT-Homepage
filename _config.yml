include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .devcontainer
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - _drafts
  - _portfolio
  - _posts
  - _publications
  - _talks
  - _teaching
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - Dockerfile
  - Gemfile
  - LICENSE
  - markdown_generator
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - scripts
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      published: false
  - scope:
      path: ""
      type: posts
    values:
      published: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
